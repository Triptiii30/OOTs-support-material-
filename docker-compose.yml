version: '3.8'

services:
  # MySQL 8.0 Database Container
  db:
    image: mysql:8.0
    container_name: smart_mfg_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_manufacturing_db
      MYSQL_USER: mfg_user
      MYSQL_PASSWORD: mfg_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_mfg_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: smart_manufacturing_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      SPRING_PROFILES_ACTIVE: mysql
      PORT: 8081
    ports:
      - "8081:8081"

volumes:
  mysql_data:
