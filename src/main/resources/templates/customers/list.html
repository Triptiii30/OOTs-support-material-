<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Customer Directory - Smart Manufacturing</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Customer Directory</h3>
            <p class="text-muted mb-0">Manage industrial manufacturing accounts, procurement contacts, and history.</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/reports/customers/export}" class="btn btn-outline-secondary">
                <i class="bi bi-download me-1"></i> Export CSV
            </a>
            <a th:href="@{/customers/new}" class="btn btn-primary" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_ORDER_STAFF')">
                <i class="bi bi-person-plus-fill me-1"></i> Add Customer
            </a>
        </div>
    </div>

    <!-- Search Bar Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-3">
            <form th:action="@{/customers}" method="get" class="row g-2">
                <div class="col-md-10">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" name="query" th:value="${query}" class="form-control"
                               placeholder="Search customer by name, company, email, or code...">
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                    <a th:href="@{/customers}" class="btn btn-outline-secondary" title="Reset"><i class="bi bi-arrow-clockwise"></i></a>
                </div>
            </form>
        </div>
    </div>

    <!-- Customers Table Card -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Contact Name</th>
                            <th>Company</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Orders</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${customers}">
                            <td class="fw-bold" th:text="${c.customerCode}">CUST-1001</td>
                            <td>
                                <a th:href="@{'/customers/' + ${c.id}}" class="fw-semibold text-decoration-none" th:text="${c.name}">Name</a>
                            </td>
                            <td th:text="${c.company}">Company</td>
                            <td th:text="${c.email}">email@example.com</td>
                            <td th:text="${c.phone}">+91 99999</td>
                            <td>
                                <span class="badge" th:classappend="${c.active ? 'bg-success' : 'bg-secondary'}"
                                      th:text="${c.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${c.orders.size()} + ' orders'">0</span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{'/customers/' + ${c.id}}" class="btn btn-outline-primary" title="View Profile">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{'/customers/edit/' + ${c.id}}" class="btn btn-outline-secondary"
                                       sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_ORDER_STAFF')" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{'/customers/delete/' + ${c.id}}" class="btn btn-outline-danger"
                                       sec:authorize="hasAuthority('ROLE_ADMIN')"
                                       onclick="return confirm('Are you sure you want to deactivate this customer?');" title="Deactivate">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${customers == null or customers.isEmpty()}">
                            <td colspan="8" class="text-center py-4 text-muted">No customers found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
