<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Users & Security - Smart Manufacturing</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Users & Role Access Control</h3>
            <p class="text-muted mb-0">System operators, plant roles, and credentials secured via BCrypt encryption.</p>
        </div>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newUserModal">
            <i class="bi bi-person-plus-fill me-1"></i> Register New User
        </button>
    </div>

    <!-- Users Table Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Department</th>
                            <th>Email</th>
                            <th>Assigned Roles</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="fw-bold" th:text="${u.username}">admin</td>
                            <td th:text="${u.fullName}">Rajesh Sharma</td>
                            <td th:text="${u.department}">Executive Leadership</td>
                            <td th:text="${u.email}">admin@smartmfg.com</td>
                            <td>
                                <span th:each="r : ${u.roles}" class="badge bg-secondary me-1" th:text="${r.name.displayName}">ROLE</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${u.active ? 'bg-success' : 'bg-danger'}"
                                      th:text="${u.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for New User Registration -->
    <div class="modal fade" id="newUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/users/create}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Register System User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Corporate Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <input type="text" class="form-control" id="department" name="department" required placeholder="e.g. Production Operations">
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label fw-semibold">Primary Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName} + ' - ' + ${r.description}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
