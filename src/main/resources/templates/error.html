<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>System Error - Smart Manufacturing</title>
</head>
<body>
<div th:fragment="content">

    <div class="card shadow-sm border-0 text-center py-5 px-4 my-4" style="max-width: 600px; margin: 0 auto;">
        <div class="card-body">
            <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3"></i>
            <h4 class="fw-bold">Operational Error Encountered</h4>
            <p class="text-muted" th:text="${errorMessage != null ? errorMessage : 'The requested operation could not be completed.'}">
                An error occurred.
            </p>
            <div class="mt-4 d-flex justify-content-center gap-2">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
