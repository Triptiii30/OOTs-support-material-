# ===================================================================
# Smart Manufacturing Order Processing System - Configuration
# ===================================================================

spring.application.name=smart-manufacturing-order-processing-system
server.port=${PORT:8081}

# Default DataSource Configuration (H2 in MySQL Compatibility Mode for zero-config local run & tests)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_manufacturing;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Console (Development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.smart.manufacturing=INFO
logging.level.org.springframework.security=WARN
