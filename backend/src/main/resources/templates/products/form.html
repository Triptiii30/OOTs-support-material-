<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${isNew ? 'New Product' : 'Edit Product'} + ' - Smart Manufacturing'">Product Form</title>
</head>
<body>
<div th:fragment="content">

    <div class="mb-4">
        <a th:href="@{/products}" class="btn btn-sm btn-outline-secondary mb-2">&larr; Back to Catalog</a>
        <h3 class="fw-bold" th:text="${isNew ? 'Define New Industrial Product' : 'Modify Product Specifications'}">Product Form</h3>
    </div>

    <div class="card shadow-sm border-0" style="max-width: 800px;">
        <div class="card-body p-4">
            <form th:action="@{/products/save}" th:object="${productDto}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="productCode" class="form-label fw-semibold">SKU / Product Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="productCode" th:field="*{productCode}"
                               th:classappend="${#fields.hasErrors('productCode')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:errors="*{productCode}">Error</div>
                    </div>

                    <div class="col-md-6">
                        <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="category" th:field="*{category}" list="catList"
                               placeholder="e.g. Robotics, Electronics, Hydraulics"
                               th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" required>
                        <datalist id="catList">
                            <option th:each="c : ${categories}" th:value="${c}"></option>
                        </datalist>
                        <div class="invalid-feedback" th:errors="*{category}">Error</div>
                    </div>

                    <div class="col-12">
                        <label for="name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:errors="*{name}">Error</div>
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Technical Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="2"></textarea>
                    </div>

                    <div class="col-md-4">
                        <label for="unitPrice" class="form-label fw-semibold">Unit Price ($) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" class="form-control" id="unitPrice" th:field="*{unitPrice}"
                               th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:errors="*{unitPrice}">Error</div>
                    </div>

                    <div class="col-md-4">
                        <label for="productionDurationHours" class="form-label fw-semibold">Mfg Duration (Hours) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="productionDurationHours" th:field="*{productionDurationHours}"
                               th:classappend="${#fields.hasErrors('productionDurationHours')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:errors="*{productionDurationHours}">Error</div>
                    </div>

                    <div class="col-md-4">
                        <label for="minStockLevel" class="form-label fw-semibold">Min Stock Threshold <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="minStockLevel" th:field="*{minStockLevel}"
                               th:classappend="${#fields.hasErrors('minStockLevel')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:errors="*{minStockLevel}">Error</div>
                    </div>

                    <div class="col-md-6" th:if="${isNew}">
                        <label for="initialStock" class="form-label fw-semibold">Initial Stock Level</label>
                        <input type="number" class="form-control" id="initialStock" th:field="*{initialStock}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Active Status</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                            <label class="form-check-label" for="active">Available for Order Processing</label>
                        </div>
                    </div>

                    <div class="col-12 mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Save Product
                        </button>
                        <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
