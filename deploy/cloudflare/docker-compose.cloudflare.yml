version: '3.8'

# Dedicated Docker Compose stack for Cloudflare-fronted deployment
services:
  db:
    image: mysql:8.0
    container_name: smart_mfg_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-smart_manufacturing_db}
      MYSQL_USER: ${DB_USER:-mfg_user}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-mfg_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_mfg_net

  app:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: smart_mfg_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smart_manufacturing_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      SPRING_PROFILES_ACTIVE: mysql
      PORT: 8081
    networks:
      - smart_mfg_net

  # Cloudflare Tunnel: securely exposes the application without opening router/firewall ports
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smart_mfg_tunnel
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - smart_mfg_net

volumes:
  mysql_data:

networks:
  smart_mfg_net:
    driver: bridge
